<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>小手机 · 朋克版</title>
    <style>
        /* ============================================================
           摇滚朋克 · 暗黑粗粝风格
           ============================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Impact', 'Arial Black', system-ui, -apple-system, sans-serif;
            letter-spacing: 0.02em;
        }

        body {
            background: #0a0a0a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 12px;
        }

        .phone-frame {
            width: 100%;
            max-width: 420px;
            height: 780px;
            background: #121212;
            border-radius: 8px;      /* 小圆角，更硬 */
            padding: 12px 8px 16px;
            box-shadow: 0 0 0 2px #e74c3c, 0 0 0 4px #121212, 0 8px 32px rgba(0,0,0,0.9);
            position: relative;
            overflow: hidden;
            border: 2px solid #e74c3c;
        }

        .phone-screen {
            width: 100%;
            height: 100%;
            background: #1a1a1a;
            border-radius: 4px;
            overflow: hidden;
            position: relative;
            display: flex;
            flex-direction: column;
            border: 1px solid #333;
        }

        /* 状态栏 — 粗犷 */
        .status-bar {
            display: flex;
            justify-content: space-between;
            padding: 6px 14px 4px;
            font-size: 12px;
            font-weight: 900;
            color: #f0f0f0;
            background: #0d0d0d;
            border-bottom: 2px solid #e74c3c;
            flex-shrink: 0;
            z-index: 10;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }
        .status-bar .time {
            color: #e74c3c;
        }

        /* 页面容器 */
        .page {
            flex: 1;
            overflow-y: auto;
            padding: 10px 12px 16px;
            display: none;
            flex-direction: column;
            background: #1a1a1a;
        }
        .page.active {
            display: flex;
        }
        .page::-webkit-scrollbar {
            width: 4px;
            background: #222;
        }
        .page::-webkit-scrollbar-thumb {
            background: #e74c3c;
            border-radius: 0;
        }

        /* ===== 角色选择页 ===== */
        #page-role .role-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 10px;
        }
        .role-card {
            background: #222;
            border: 2px solid #444;
            border-radius: 0;
            padding: 20px 12px;
            text-align: center;
            cursor: pointer;
            transition: 0.15s;
            color: #f0f0f0;
        }
        .role-card:active {
            transform: scale(0.94);
            border-color: #e74c3c;
        }
        .role-card.selected {
            border-color: #e74c3c;
            background: #2a1515;
        }
        .role-card .avatar {
            width: 60px;
            height: 60px;
            border-radius: 0;
            background: #e74c3c;
            color: #121212;
            font-size: 28px;
            font-weight: 900;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 8px;
            border: 2px solid #f0f0f0;
        }
        .role-card .name {
            font-weight: 900;
            font-size: 18px;
            color: #f0f0f0;
            letter-spacing: 0.05em;
        }
        .role-card .desc {
            font-size: 12px;
            color: #aaa;
            margin-top: 4px;
            line-height: 1.3;
            font-weight: 300;
        }

        .page-title {
            font-size: 26px;
            font-weight: 900;
            color: #f0f0f0;
            padding: 4px 0 2px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            border-bottom: 3px solid #e74c3c;
            display: inline-block;
            margin-bottom: 6px;
        }
        .page-sub {
            font-size: 13px;
            color: #aaa;
            margin-bottom: 10px;
            font-weight: 300;
        }

        .btn {
            background: #e74c3c;
            color: #121212;
            border: none;
            border-radius: 0;
            padding: 12px 18px;
            font-size: 16px;
            font-weight: 900;
            cursor: pointer;
            transition: 0.1s;
            text-align: center;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            border: 2px solid #e74c3c;
        }
        .btn:active {
            transform: scale(0.94);
            background: #c0392b;
        }
        .btn-secondary {
            background: transparent;
            color: #f0f0f0;
            border: 2px solid #555;
        }
        .btn-secondary:active {
            background: #333;
        }
        .btn-danger {
            background: #c0392b;
            border-color: #c0392b;
        }
        .btn-sm {
            padding: 6px 12px;
            font-size: 12px;
        }
        .btn-block {
            width: 100%;
        }
        .mt-8 { margin-top: 8px; }
        .mt-12 { margin-top: 12px; }
        .mt-16 { margin-top: 16px; }
        .mb-8 { margin-bottom: 8px; }
        .flex { display: flex; }
        .flex-between { display: flex; justify-content: space-between; align-items: center; }
        .gap-8 { gap: 8px; }
        .gap-12 { gap: 12px; }
        .text-muted { color: #888; font-size: 13px; font-weight: 300; }
        .text-center { text-align: center; }

        /* ===== 手机首页 ===== */
        #page-home .home-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 2px 0 10px;
            border-bottom: 2px solid #333;
        }
        #page-home .home-header .role-name {
            font-weight: 900;
            font-size: 20px;
            color: #f0f0f0;
            letter-spacing: 0.08em;
        }
        #page-home .home-header .role-switch {
            font-size: 12px;
            color: #e74c3c;
            cursor: pointer;
            font-weight: 700;
            text-transform: uppercase;
            border: 1px solid #e74c3c;
            padding: 2px 10px;
        }

        .app-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px 6px;
            margin-top: 8px;
        }
        .app-icon {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            padding: 6px 2px;
            border-radius: 0;
            background: transparent;
            border: none;
            color: #f0f0f0;
            transition: 0.1s;
        }
        .app-icon:active {
            transform: scale(0.92);
            background: #2a2a2a;
        }
        .app-icon .icon-box {
            width: 52px;
            height: 52px;
            border-radius: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            color: #121212;
            background: #e74c3c;
            border: 2px solid #f0f0f0;
            margin-bottom: 4px;
            position: relative;
        }
        .app-icon .icon-box .badge {
            position: absolute;
            top: -6px;
            right: -6px;
            background: #e74c3c;
            color: #121212;
            font-size: 10px;
            font-weight: 900;
            min-width: 18px;
            height: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 4px;
            border: 1px solid #f0f0f0;
        }
        .app-icon .app-name {
            font-size: 11px;
            color: #ccc;
            font-weight: 700;
            text-align: center;
            line-height: 1.2;
            text-transform: uppercase;
        }
        .app-icon .app-name .custom-tag {
            font-size: 8px;
            color: #aaa;
            background: #333;
            padding: 0 4px;
            margin-left: 2px;
        }

        .home-toolbar {
            display: flex;
            gap: 6px;
            margin-top: 14px;
            flex-wrap: wrap;
        }
        .home-toolbar .btn {
            flex: 1;
            min-width: 50px;
            font-size: 12px;
            padding: 8px 6px;
        }

        /* ===== App 内容页 ===== */
        .app-page-header {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 4px 0 10px;
            border-bottom: 2px solid #333;
            margin-bottom: 10px;
            flex-shrink: 0;
        }
        .app-page-header .back-btn {
            font-size: 26px;
            cursor: pointer;
            background: none;
            border: none;
            color: #e74c3c;
            font-weight: 300;
            line-height: 1;
        }
        .app-page-header .app-title {
            font-size: 22px;
            font-weight: 900;
            color: #f0f0f0;
            flex: 1;
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }
        .app-page-header .refresh-btn {
            font-size: 12px;
            color: #e74c3c;
            background: none;
            border: 2px solid #e74c3c;
            font-weight: 700;
            cursor: pointer;
            padding: 4px 12px;
            text-transform: uppercase;
        }

        .app-list {
            flex: 1;
            overflow-y: auto;
        }
        .app-list .list-item {
            background: #222;
            border: 2px solid #333;
            border-radius: 0;
            padding: 12px 14px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: 0.1s;
            color: #f0f0f0;
        }
        .app-list .list-item:active {
            transform: scale(0.97);
            border-color: #e74c3c;
        }
        .app-list .list-item .item-title {
            font-weight: 900;
            font-size: 16px;
            color: #f0f0f0;
            letter-spacing: 0.04em;
        }
        .app-list .list-item .item-desc {
            font-size: 13px;
            color: #aaa;
            margin-top: 2px;
            font-weight: 300;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .app-list .list-item .item-time {
            font-size: 11px;
            color: #777;
            margin-top: 4px;
            font-weight: 300;
            border-top: 1px solid #333;
            padding-top: 4px;
        }
        .app-list .empty-state {
            text-align: center;
            color: #888;
            padding: 40px 0;
            font-size: 14px;
            font-weight: 300;
        }
        .app-list .empty-state .emoji {
            font-size: 40px;
            display: block;
            margin-bottom: 10px;
        }

        /* ===== 详情页 ===== */
        #page-detail .detail-card {
            background: #222;
            border: 2px solid #444;
            border-radius: 0;
            padding: 18px;
            color: #f0f0f0;
        }
        #page-detail .detail-card .detail-title {
            font-size: 22px;
            font-weight: 900;
            color: #f0f0f0;
            margin-bottom: 4px;
            letter-spacing: 0.04em;
        }
        #page-detail .detail-card .detail-time {
            font-size: 13px;
            color: #aaa;
            margin-bottom: 10px;
            border-bottom: 1px solid #333;
            padding-bottom: 6px;
        }
        #page-detail .detail-card .detail-body {
            font-size: 15px;
            line-height: 1.7;
            color: #ddd;
            font-weight: 300;
            white-space: pre-wrap;
            word-break: break-word;
        }
        #page-detail .detail-card .detail-meta {
            font-size: 12px;
            color: #777;
            margin-top: 12px;
            padding-top: 10px;
            border-top: 2px solid #333;
        }

        /* ===== 设置页 ===== */
        #page-settings .setting-group {
            background: #222;
            border: 2px solid #333;
            border-radius: 0;
            padding: 4px 0;
            margin-bottom: 12px;
        }
        #page-settings .setting-item {
            padding: 10px 14px;
            border-bottom: 1px solid #333;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #f0f0f0;
        }
        #page-settings .setting-item:last-child {
            border-bottom: none;
        }
        #page-settings .setting-item .label {
            font-size: 15px;
            font-weight: 700;
        }
        #page-settings .setting-item .value {
            font-size: 13px;
            color: #aaa;
        }
        #page-settings textarea {
            width: 100%;
            min-height: 120px;
            border-radius: 0;
            border: 2px solid #444;
            padding: 10px;
            font-size: 13px;
            line-height: 1.6;
            resize: vertical;
            background: #1a1a1a;
            color: #f0f0f0;
            font-family: 'Courier New', monospace;
            font-weight: 300;
        }
        #page-settings textarea:focus {
            outline: none;
            border-color: #e74c3c;
        }

        /* ===== 自定义 App ===== */
        #page-custom .form-group {
            margin-bottom: 12px;
        }
        #page-custom .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 700;
            color: #f0f0f0;
            margin-bottom: 4px;
            text-transform: uppercase;
        }
        #page-custom .form-group input,
        #page-custom .form-group textarea {
            width: 100%;
            padding: 10px 12px;
            border-radius: 0;
            border: 2px solid #444;
            font-size: 14px;
            background: #1a1a1a;
            color: #f0f0f0;
            font-weight: 300;
        }
        #page-custom .form-group input:focus,
        #page-custom .form-group textarea:focus {
            outline: none;
            border-color: #e74c3c;
        }
        #page-custom .form-group textarea {
            min-height: 90px;
            resize: vertical;
        }

        /* ===== 加载遮罩 ===== */
        .loading-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            display: none;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            border-radius: 4px;
            z-index: 100;
            color: #f0f0f0;
        }
        .loading-overlay.active {
            display: flex;
        }
        .loading-overlay .spinner {
            width: 44px;
            height: 44px;
            border: 4px solid #333;
            border-top-color: #e74c3c;
            border-radius: 0;
            animation: spin 0.7s linear infinite;
        }
        .loading-overlay .label {
            margin-top: 14px;
            font-size: 16px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ===== Toast ===== */
        .toast {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            background: #222;
            border: 2px solid #e74c3c;
            color: #f0f0f0;
            padding: 10px 24px;
            border-radius: 0;
            font-size: 14px;
            font-weight: 700;
            z-index: 200;
            display: none;
            white-space: nowrap;
            pointer-events: none;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }
        .toast.show {
            display: block;
            animation: toastIn 0.25s ease;
        }
        @keyframes toastIn {
            from { opacity: 0; transform: translateX(-50%) translateY(12px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }

        /* ===== 响应式 ===== */
        @media (max-width: 440px) {
            body { padding: 0; }
            .phone-frame {
                max-width: 100%;
                height: 100vh;
                border-radius: 0;
                padding: 0;
                box-shadow: none;
                border: none;
            }
            .phone-screen { border-radius: 0; }
            .loading-overlay { border-radius: 0; }
        }

        /* ===== 滚动条 ===== */
        .page::-webkit-scrollbar,
        .app-list::-webkit-scrollbar {
            width: 4px;
            background: #222;
        }
        .page::-webkit-scrollbar-thumb,
        .app-list::-webkit-scrollbar-thumb {
            background: #e74c3c;
            border-radius: 0;
        }

        /* 角色选择页特殊 */
        #page-role .role-actions {
            margin-top: 14px;
            display: flex;
            gap: 6px;
        }
        #page-role .role-actions .btn {
            flex: 1;
        }

        /* 进度条 */
        .progress-bar {
            width: 100%;
            height: 6px;
            background: #333;
            border-radius: 0;
            overflow: hidden;
            margin: 6px 0;
        }
        .progress-bar .fill {
            height: 100%;
            background: #e74c3c;
            width: 0%;
            transition: width 0.3s;
        }

        /* 额外朋克装饰 */
        .punk-divider {
            border: none;
            border-top: 4px double #e74c3c;
            margin: 8px 0;
        }
        .tag-punk {
            background: #e74c3c;
            color: #121212;
            padding: 2px 8px;
            font-weight: 900;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            display: inline-block;
        }
        .text-red {
            color: #e74c3c;
        }
    </style>
</head>
<body>

<div class="phone-frame">
    <div class="phone-screen" id="app">

        <!-- 状态栏 -->
        <div class="status-bar">
            <span class="time" id="statusTime">00:00</span>
            <span>⚡ 🔥</span>
        </div>

        <!-- ===== 角色选择页 ===== -->
        <div class="page active" id="page-role">
            <div class="page-title">⛓️ 小手机</div>
            <div class="page-sub">选择手机的主人 · 摇滚灵魂</div>
            <div class="role-grid" id="roleGrid"></div>
            <div class="role-actions">
                <button class="btn btn-secondary btn-sm" onclick="addDefaultRole()">➕ 添加角色</button>
                <button class="btn btn-sm" onclick="enterHome()" id="enterHomeBtn" disabled>进入手机 →</button>
            </div>
            <div style="margin-top:10px;font-size:12px;color:#888;text-align:center;border-top:1px solid #333;padding-top:8px;">
                当前角色: <span id="currentRoleDisplay" style="color:#e74c3c;font-weight:900;">未选择</span>
            </div>
        </div>

        <!-- ===== 手机首页 ===== -->
        <div class="page" id="page-home">
            <div class="home-header">
                <div>
                    <div class="role-name" id="homeRoleName">角色</div>
                    <div style="font-size:11px;color:#888;" id="homeRoleSub">点击切换</div>
                </div>
                <div class="role-switch" onclick="goToRoleSelect()">切换 ↻</div>
            </div>
            <div class="app-grid" id="homeAppGrid"></div>
            <div class="home-toolbar">
                <button class="btn btn-secondary btn-sm" onclick="refreshAllApps()">🔄 整机刷新</button>
                <button class="btn btn-secondary btn-sm" onclick="openSettings()">⚙️ 设置</button>
                <button class="btn btn-secondary btn-sm" onclick="openCustomApp()">➕ 自定义</button>
            </div>
            <div style="margin-top:10px;font-size:11px;color:#666;text-align:center;border-top:2px solid #333;padding-top:8px;">
                数据存于本地 · <span id="homeAppCount">0</span> 个应用
            </div>
        </div>

        <!-- ===== App 内容页 ===== -->
        <div class="page" id="page-app">
            <div class="app-page-header">
                <button class="back-btn" onclick="goHome()">‹</button>
                <span class="app-title" id="appPageTitle">应用</span>
                <button class="refresh-btn" onclick="refreshCurrentApp()">刷新</button>
            </div>
            <div class="app-list" id="appListContainer"></div>
        </div>

        <!-- ===== 详情页 ===== -->
        <div class="page" id="page-detail">
            <div class="app-page-header">
                <button class="back-btn" onclick="goBackToApp()">‹</button>
                <span class="app-title" id="detailPageTitle">详情</span>
                <span style="width:40px;"></span>
            </div>
            <div id="detailContainer"></div>
        </div>

        <!-- ===== 设置页 ===== -->
        <div class="page" id="page-settings">
            <div class="app-page-header">
                <button class="back-btn" onclick="goHome()">‹</button>
                <span class="app-title">提示词设置</span>
                <button class="refresh-btn" onclick="savePrompts()">保存</button>
            </div>
            <div id="settingsContainer"></div>
        </div>

        <!-- ===== 自定义 App 页 ===== -->
        <div class="page" id="page-custom">
            <div class="app-page-header">
                <button class="back-btn" onclick="goHome()">‹</button>
                <span class="app-title">自定义 App</span>
                <button class="refresh-btn" onclick="submitCustomApp()">创建</button>
            </div>
            <div style="padding:4px 0;">
                <div class="form-group">
                    <label>应用名称</label>
                    <input id="customAppName" placeholder="例如：微博" />
                </div>
                <div class="form-group">
                    <label>图标 (Emoji)</label>
                    <input id="customAppIcon" placeholder="例如：📱" value="📱" />
                </div>
                <div class="form-group">
                    <label>提示词</label>
                    <textarea id="customAppPrompt" placeholder="描述生成规则...">根据角色设定，生成该应用的数据。返回JSON：{"items":[{"title":"","desc":"","time":"","detail":""}]}</textarea>
                </div>
                <button class="btn btn-block" onclick="submitCustomApp()">✨ 创建并注册</button>
            </div>
        </div>

        <!-- ===== 加载遮罩 ===== -->
        <div class="loading-overlay" id="loadingOverlay">
            <div class="spinner"></div>
            <div class="label" id="loadingLabel">加载中...</div>
            <div style="margin-top:6px;font-size:13px;opacity:0.7;" id="loadingSub"></div>
        </div>

        <!-- ===== Toast ===== -->
        <div class="toast" id="toast"></div>
    </div>
</div>

<script>
    // ================================================================
    // 小手机系统 - 核心引擎 (功能逻辑不变，仅视觉朋克化)
    // ================================================================

    // ---- 存储工具 ----
    const Storage = {
        get(key, def) {
            try {
                const raw = localStorage.getItem('phone_' + key);
                return raw ? JSON.parse(raw) : def;
            } catch { return def; }
        },
        set(key, val) {
            localStorage.setItem('phone_' + key, JSON.stringify(val));
        },
        remove(key) {
            localStorage.removeItem('phone_' + key);
        }
    };

    // ---- 上下文构建 ----
    function buildPhoneRoleContext(contactId, currentAppId) {
        const role = STATE.roles.find(r => r.id === contactId);
        if (!role) return '【错误】角色不存在';
        const allApps = getAllApps();
        const roleData = STATE.phoneData[contactId] || {};
        const snapshots = {};
        for (const [appId, app] of Object.entries(allApps)) {
            if (appId === currentAppId) continue;
            const data = roleData[appId];
            if (data && data.items && data.items.length > 0) {
                snapshots[appId] = data.items.slice(0, 5);
            }
        }
        const now = new Date();
        const timeStr = now.toLocaleString('zh-CN', { hour12: false });

        let ctx = `【角色人设】\n${role.persona || '（未设定）'}\n\n`;
        ctx += `【世界书】\n${role.worldBook || '（未设定）'}\n\n`;
        ctx += `【长期记忆】\n${role.memory || '（暂无）'}\n\n`;
        ctx += `【近期聊天】\n${role.recentChat || '（暂无）'}\n\n`;
        ctx += `【其他App已有数据】\n`;
        if (Object.keys(snapshots).length === 0) {
            ctx += '（暂无其他App数据）\n';
        } else {
            for (const [appId, items] of Object.entries(snapshots)) {
                const app = allApps[appId];
                ctx += `【${app ? app.name : appId}】\n`;
                items.forEach((item, i) => {
                    ctx += `  ${i+1}. ${item.title || '无标题'} | ${item.time || ''}\n`;
                });
            }
        }
        ctx += `\n【当前设备时间】\n${timeStr}\n`;
        return ctx;
    }

    // ---- AI 模拟生成 ----
    function simulateGenerate(appId, context, appPrompt, count = 4) {
        const nameMatch = context.match(/【角色人设】\n([^\n]*)/);
        const roleName = nameMatch ? nameMatch[1].trim().substring(0, 6) : '用户';
        const timeMatch = context.match(/【当前设备时间】\n([^\n]*)/);
        const baseTime = timeMatch ? timeMatch[1].trim() : new Date().toLocaleString('zh-CN', { hour12: false });

        const appNames = {
            wechat: ['小明', '小红', '小刚', '小丽', '阿杰', '小美', '老王', '小李'],
            gallery: ['日落', '街景', '美食', '宠物', '风景', '聚会', '运动', '旅行'],
            wallet: ['星巴克', '便利店', '地铁', '超市', '餐饮', '购物', '电影', '打车'],
            browser: ['新闻', '百科', '视频', '音乐', '论坛', '博客', '天气', '地图'],
            maps: ['公司', '家', '商场', '公园', '餐厅', '咖啡厅', '地铁站', '电影院'],
            notes: ['待办', '灵感', '日记', '清单', '摘要', '计划', '备忘', '随笔'],
            sms: ['快递', '银行', '验证码', '提醒', '通知', '广告', '朋友', '家人']
        };
        const defaultTitles = ['日常', '记录', '分享', '互动', '生活', '工作', '学习', '娱乐'];
        const titles = appNames[appId] || defaultTitles;

        const items = [];
        const countNum = Math.min(count, 8);
        const now = new Date();
        for (let i = 0; i < countNum; i++) {
            const t = new Date(now);
            t.setHours(now.getHours() - i * 2 - Math.floor(Math.random() * 3));
            const timeStr = t.toLocaleString('zh-CN', { hour12: false });
            const title = titles[Math.floor(Math.random() * titles.length)] + (i > 0 ? ` ${i+1}` : '');
            const descs = ['分享了日常', '记录了时刻', '互动了一下', '完成了任务', '体验了新事物', '留下了回忆', '更新了状态', '记录了心情'];
            const desc = descs[Math.floor(Math.random() * descs.length)];
            const details = [
                `详细内容：${roleName}在${timeStr}的时候，${desc}。这是一条${appId}的记录。`,
                `更多信息：${roleName}当时正在${['工作','学习','休息','出行','购物','娱乐'][Math.floor(Math.random()*6)]}。`
            ];
            items.push({
                title: title,
                desc: desc,
                time: timeStr,
                detail: details.join('\n') + `\n（模拟生成 · ${appId}）`
            });
        }
        return { items };
    }

    async function callAI(prompt) {
        return new Promise((resolve) => {
            setTimeout(() => {
                resolve(simulateGenerate('wechat', prompt, '', 5));
            }, 300);
        });
    }

    // ---- 生成与保存 ----
    async function generateAppData(contactId, appId, forceRefresh = false) {
        const role = STATE.roles.find(r => r.id === contactId);
        if (!role) throw new Error('角色不存在');
        const allApps = getAllApps();
        const app = allApps[appId];
        if (!app) throw new Error('App不存在');

        const context = buildPhoneRoleContext(contactId, appId);
        let prompt = app.prompt || '生成数据。返回JSON: {"items":[]}';
        const customPrompt = STATE.appPrompts[contactId]?.[appId] || STATE.appPrompts[appId];
        if (customPrompt) prompt = customPrompt;

        const finalPrompt = `
        ${context}
        ---
        全局规则：
        1. 必须符合角色人设。
        2. 必须参考世界书和长期记忆。
        3. 参考其他App已有数据，保持一致性。
        4. 可以补全日常细节，不制造重大剧情。
        5. 生成时间不得明显超出当前时间。
        6. 不同App之间尽量保持一致。
        ---
        【${app.name}专属规则】
        ${prompt}
        ---
        只返回合法JSON，不要任何解释、Markdown或代码块标记。
        格式：{"items":[{"title":"","desc":"","time":"","detail":""}]}
        `;
        const result = await callAI(finalPrompt);
        return result;
    }

    // ---- 整机刷新 ----
    async function refreshAllApps() {
        const contactId = STATE.currentContactId;
        if (!contactId) { showToast('请先选择角色'); return; }
        const allApps = getAllApps();
        const appIds = Object.keys(allApps);
        if (appIds.length === 0) { showToast('没有可用的App'); return; }

        showLoading('整机刷新中...', `正在生成 ${appIds.length} 个应用的数据`);

        try {
            const role = STATE.roles.find(r => r.id === contactId);
            const context = buildPhoneRoleContext(contactId, null);

            const appPrompts = {};
            for (const [id, app] of Object.entries(allApps)) {
                let p = app.prompt || '生成数据。返回JSON: {"items":[]}';
                const custom = STATE.appPrompts[contactId]?.[id] || STATE.appPrompts[id];
                if (custom) p = custom;
                appPrompts[id] = p;
            }

            const finalPrompt = `
        ${context}
        ---
        全局规则：
        1. 必须符合角色人设。
        2. 必须参考世界书和长期记忆。
        3. 各App数据必须保持时间线和事件一致性。
        4. 可以补全日常细节，不制造重大剧情。
        5. 生成时间不得明显超出当前时间。
        ---
        请为以下所有App生成数据，每个App返回一个items数组。
        各App之间要保持事件一致性（同一时间、地点、人物、事件要在不同App中对应）。
        ---
        ${Object.entries(appPrompts).map(([id, p]) => `【${allApps[id]?.name || id}】\n${p}`).join('\n---\n')}
        ---
        返回JSON格式：
        {
          "wechat": {"items":[...]},
          "gallery": {"items":[...]},
          ...
        }
        只返回合法JSON，不要任何解释、Markdown或代码块标记。
        `;

            const allData = await simulateFullGenerate(finalPrompt, allApps);

            let count = 0;
            for (const [id, data] of Object.entries(allData)) {
                if (data && data.items) {
                    saveAppData(contactId, id, data);
                    count += data.items.length;
                }
            }

            hideLoading();
            showToast(`整机刷新完成！共生成 ${count} 条记录`);
            renderHome();
        } catch (e) {
            hideLoading();
            showToast('刷新失败: ' + e.message);
            console.error(e);
        }
    }

    function simulateFullGenerate(prompt, allApps) {
        const result = {};
        const now = new Date();
        const roleName = '角色';
        const events = [];
        for (let i = 0; i < 6; i++) {
            const t = new Date(now);
            t.setHours(now.getHours() - i * 2 - Math.floor(Math.random() * 2));
            const timeStr = t.toLocaleString('zh-CN', { hour12: false });
            const activities = ['在家休息', '外出散步', '购物', '用餐', '工作', '学习', '运动', '社交'];
            const places = ['家', '公司', '商场', '公园', '餐厅', '咖啡厅', '地铁站', '电影院'];
            const people = ['朋友', '同事', '家人', '独自'];
            events.push({
                time: timeStr,
                activity: activities[Math.floor(Math.random() * activities.length)],
                place: places[Math.floor(Math.random() * places.length)],
                person: people[Math.floor(Math.random() * people.length)],
                detail: `${roleName}在${timeStr}${activities[Math.floor(Math.random() * activities.length)]}`
            });
        }

        for (const [id, app] of Object.entries(allApps)) {
            const items = [];
            const count = Math.min(3 + Math.floor(Math.random() * 4), 6);
            for (let i = 0; i < count; i++) {
                const evt = events[i % events.length];
                const titles = {
                    wechat: ['聊天', '消息', '群聊', '私信'],
                    gallery: ['照片', '风景', '美食', '自拍'],
                    wallet: ['消费', '充值', '转账', '支付'],
                    browser: ['搜索', '浏览', '查看', '阅读'],
                    maps: ['位置', '导航', '足迹', '地点'],
                    notes: ['备忘', '笔记', '记录', '清单'],
                    sms: ['短信', '通知', '验证码', '提醒']
                };
                const titleList = titles[id] || ['记录', '条目'];
                const title = titleList[i % titleList.length] + (i > 0 ? ` ${i+1}` : '');
                const desc = `${evt.activity} · ${evt.place}`;
                items.push({
                    title: title,
                    desc: desc,
                    time: evt.time,
                    detail: `${evt.detail}\n地点：${evt.place}\n人物：${evt.person}\n（整机生成 · ${app.name}）`
                });
            }
            result[id] = { items };
        }
        return result;
    }

            persona: `一个${['普通上班族','自由职业者','学生','创业者','艺术家'][Math.floor(Math.random()*5)]}，性格${['开朗','内向','稳重','活泼','幽默'][Math.floor(Math.random()*5)]}，喜欢${['音乐','旅行','阅读','美食','运动'][Math.floor(Math.random()*5)]}。`,
            worldBook: `生活在${['北京','上海','深圳','杭州','成都'][Math.floor(Math.random()*5)]}，${['工作日朝九晚五','时间自由','周末喜欢外出','经常加班','热爱生活'][Math.floor(Math.random()*5)]}。`,
            memory: `最近${['去了趟公园','看了一部电影','和朋友聚餐','完成了项目','买了个新设备'][Math.floor(Math.random()*5)]}。`,
            recentChat: `昨天和${['朋友','同事','家人'][Math.floor(Math.random()*3)]}聊了${['周末计划','工作近况','生活琐事','兴趣爱好'][Math.floor(Math.random()*4)]}。`
        };
        STATE.roles.push(newRole);
        Storage.set('roles', STATE.roles);
        if (!STATE.currentContactId) {
            STATE.currentContactId = newRole.id;
            Storage.set('currentRole', newRole.id);
        }
        renderRoleSelect();
        showToast('已添加角色: ' + newRole.name);
    }

    function enterHome() {
        if (!STATE.currentContactId) { showToast('请先选择一个角色'); return; }
        renderHome();
        showPage('page-home');
    }

    function goToRoleSelect() {
        showPage('page-role');
        renderRoleSelect();
    }

    function renderHome() {
        const contactId = STATE.currentContactId;
        if (!contactId) { return; }
        const role = STATE.roles.find(r => r.id === contactId);
        if (!role) { return; }

        document.getElementById('homeRoleName').textContent = role.name;
        document.getElementById('homeRoleSub').textContent = role.persona ? role.persona.substring(0, 20) + '...' : '点击切换角色';

        const allApps = getAllApps();
        const appIds = Object.keys(allApps);
        const grid = document.getElementById('homeAppGrid');

        const roleData = STATE.phoneData[contactId] || {};

        grid.innerHTML = appIds.map(id => {
            const app = allApps[id];
            const data = roleData[id];
            const count = app.getCount(data);
            return `
                <button class="app-icon" onclick="openApp('${id}')">
                    <div class="icon-box" style="background:${app.color || '#e74c3c'}">
                        ${app.icon || '📱'}
                        ${count > 0 ? `<span class="badge">${count > 99 ? '99+' : count}</span>` : ''}
                    </div>
                    <div class="app-name">${app.name}${app.isCustom ? '<span class="custom-tag">自</span>' : ''}</div>
                </button>
            `;
        }).join('');

        document.getElementById('homeAppCount').textContent = appIds.length;
        renderSettings();
    }

    function renderAppPage(appId) {
        const contactId = STATE.currentContactId;
        if (!contactId) { showToast('请先选择角色'); return; }

        const allApps = getAllApps();
        const app = allApps[appId];
        if (!app) { showToast('App不存在'); return; }

        STATE.currentAppId = appId;
        document.getElementById('appPageTitle').textContent = app.name;

        const data = getAppData(contactId, appId);
        const items = data.items || [];
        const container = document.getElementById('appListContainer');

        if (items.length === 0) {
            container.innerHTML = `
                <div class="empty-state">
                    <span class="emoji">📭</span>
                    还没有数据，点击右上角「刷新」生成
                </div>
            `;
        } else {
            container.innerHTML = items.map((item, index) => `
                <div class="list-item" onclick="openDetail(${index})">
                    ${app.renderItem(item)}
                </div>
            `).join('');
        }

        showPage('page-app');
    }

    function openDetail(index) {
        const contactId = STATE.currentContactId;
        const appId = STATE.currentAppId;
        if (!contactId || !appId) return;

        const allApps = getAllApps();
        const app = allApps[appId];
        if (!app) return;

        const data = getAppData(contactId, appId);
        const items = data.items || [];
        if (index < 0 || index >= items.length) return;

        STATE.currentDetailIndex = index;
        const item = items[index];
        document.getElementById('detailPageTitle').textContent = app.name + ' · 详情';

        const container = document.getElementById('detailContainer');
        container.innerHTML = `
            <div class="detail-card">
                ${app.renderDetail(item)}
                <div class="detail-meta">#${index+1} · ${app.name}</div>
            </div>
        `;
        showPage('page-detail');
    }

    function goBackToApp() {
        if (STATE.currentAppId) {
            renderAppPage(STATE.currentAppId);
        } else {
            goHome();
        }
    }

    function goHome() {
        renderHome();
        showPage('page-home');
    }

    function openApp(appId) {
        renderAppPage(appId);
    }

    function refreshCurrentApp() {
        const contactId = STATE.currentContactId;
        const appId = STATE.currentAppId;
        if (!contactId || !appId) return;
        refreshSingleApp(contactId, appId);
    }

    // ---- 设置页 ----
    function openSettings() {
        renderSettings();
        showPage('page-settings');
    }

    function renderSettings() {
        const contactId = STATE.currentContactId;
        const allApps = getAllApps();
        const container = document.getElementById('settingsContainer');

        let html = `<div class="setting-group"><div class="setting-item"><span class="label">当前角色</span><span class="value">${contactId ? (STATE.roles.find(r=>r.id===contactId)?.name||'未知') : '未选择'}</span></div></div>`;

        for (const [id, app] of Object.entries(allApps)) {
            const key = contactId ? `${contactId}_${id}` : id;
            const prompt = STATE.appPrompts[contactId]?.[id] || STATE.appPrompts[id] || app.prompt || '';
            html += `
                <div class="setting-group">
                    <div class="setting-item"><span class="label">${app.icon} ${app.name}</span><span class="value">${app.isCustom ? '自定义' : '内置'}</span></div>
                    <div style="padding:8px 14px 14px;">
                        <textarea id="prompt_${id}" placeholder="输入提示词...">${prompt.replace(/"/g, '&quot;')}</textarea>
                        <button class="btn btn-secondary btn-sm mt-8" onclick="resetPrompt('${id}')">恢复默认</button>
                    </div>
                </div>
            `;
        }
        container.innerHTML = html;
    }

    function savePrompts() {
        const contactId = STATE.currentContactId;
        const allApps = getAllApps();
        if (!STATE.appPrompts[contactId]) STATE.appPrompts[contactId] = {};

        for (const [id] of Object.entries(allApps)) {
            const el = document.getElementById('prompt_' + id);
            if (el) {
                const val = el.value.trim();
                if (val) {
                    STATE.appPrompts[contactId][id] = val;
                } else {
                    delete STATE.appPrompts[contactId][id];
                }
            }
        }
        Storage.set('appPrompts', STATE.appPrompts);
        showToast('提示词已保存');
    }

    function resetPrompt(appId) {
        const allApps = getAllApps();
        const app = allApps[appId];
        if (!app) return;
        const el = document.getElementById('prompt_' + appId);
        if (el) el.value = app.prompt || '';
        const contactId = STATE.currentContactId;
        if (contactId && STATE.appPrompts[contactId]) {
            delete STATE.appPrompts[contactId][appId];
            Storage.set('appPrompts', STATE.appPrompts);
        }
        showToast('已恢复默认');
    }

    // ---- 自定义App ----
    function openCustomApp() {
        document.getElementById('customAppName').value = '';
        document.getElementById('customAppIcon').value = '📱';
        document.getElementById('customAppPrompt').value = '根据角色设定，生成该应用的数据。返回JSON格式：{"items":[{"title":"","desc":"","time":"","detail":""}]}';
        showPage('page-custom');
    }

    function submitCustomApp() {
        const name = document.getElementById('customAppName').value.trim();
        const icon = document.getElementById('customAppIcon').value.trim() || '📱';
        const prompt = document.getElementById('customAppPrompt').value.trim();

        if (!name) { showToast('请输入应用名称'); return; }
        if (!prompt) { showToast('请输入提示词'); return; }

        const id = 'custom_' + Date.now();
        const newApp = { id, name, icon, prompt };
        STATE.customApps.push(newApp);
        Storage.set('customApps', STATE.customApps);

        document.getElementById('customAppName').value = '';
        showToast('已创建: ' + name);
        renderHome();
        goHome();
    }

    // ---- 页面切换 ----
    function showPage(pageId) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.getElementById(pageId).classList.add('active');
    }

    // ---- Loading & Toast ----
    function showLoading(label, sub) {
        const overlay = document.getElementById('loadingOverlay');
        document.getElementById('loadingLabel').textContent = label || '加载中...';
        document.getElementById('loadingSub').textContent = sub || '';
        overlay.classList.add('active');
    }

    function hideLoading() {
        document.getElementById('loadingOverlay').classList.remove('active');
    }

    let toastTimer = null;

    function showToast(msg) {
        const el = document.getElementById('toast');
        el.textContent = msg;
        el.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => el.classList.remove('show'), 2500);
    }

    // ---- 状态栏时间 ----
    function updateStatusTime() {
        const now = new Date();
        document.getElementById('statusTime').textContent =
            now.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
    }
    setInterval(updateStatusTime, 30000);
    updateStatusTime();

    // ---- 初始化 ----
    function init() {
        const savedRole = Storage.get('currentRole', null);
        if (savedRole && STATE.roles.some(r => r.id === savedRole)) {
            STATE.currentContactId = savedRole;
        } else if (STATE.roles.length > 0) {
            STATE.currentContactId = STATE.roles[0].id;
            Storage.set('currentRole', STATE.currentContactId);
        }

        const custom = Storage.get('customApps', []);
        STATE.customApps = custom;

        const prompts = Storage.get('appPrompts', {});
        STATE.appPrompts = prompts;

        renderRoleSelect();
        if (STATE.currentContactId) {
            renderHome();
            showPage('page-home');
        } else {
            showPage('page-role');
        }

        if (STATE.roles.length === 0) {
            addDefaultRole();
        }

        console.log('📱 小手机系统 (摇滚朋克版) 已启动');
    }

    init();

    // ---- 暴露全局 ----
    window.selectRole = selectRole;
    window.addDefaultRole = addDefaultRole;
    window.enterHome = enterHome;
    window.goToRoleSelect = goToRoleSelect;
    window.openApp = openApp;
    window.openDetail = openDetail;
    window.goBackToApp = goBackToApp;
    window.goHome = goHome;
    window.refreshCurrentApp = refreshCurrentApp;
    window.refreshAllApps = refreshAllApps;
    window.openSettings = openSettings;
    window.savePrompts = savePrompts;
    window.resetPrompt = resetPrompt;
    window.openCustomApp = openCustomApp;
    window.submitCustomApp = submitCustomApp;
    window.showToast = showToast;
    window.showPage = showPage;
    window.renderHome = renderHome;
    window.renderRoleSelect = renderRoleSelect;
    window.renderAppPage = renderAppPage;
    window.getAllApps = getAllApps;
    window.STATE = STATE;
    window.Storage = Storage;
</script>
</body>
</html>
