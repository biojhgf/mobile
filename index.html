<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
  <title>小手机 · 精简版</title>
  <style>
    /* ===== 自定义字体 ===== */
    @font-face {
      font-family: 'CustomFont';
      src: url('https://zora404.dpdns.org/file/1786970803671_肉の病症小猫___1_.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
    }

    /* ===== 全局 ===== */
    :root {
      --bg: #f5f3f0;
      --bg-card: #ffffff;
      --bg-input: #f0ede8;
      --bg-dark: #1a1a1a;
      --text: #1a1a1a;
      --text-sec: #6e6a66;
      --text-ter: #b0aaa4;
      --gold: #c9a87c;
      --radius: 12px;
      --radius-sm: 6px;
      --radius-full: 999px;
      --shadow: 0 2px 16px rgba(26,26,26,0.04);
      --border: 1px solid rgba(26,26,26,0.04);
      --font: 'CustomFont', -apple-system, 'Helvetica Neue', system-ui, sans-serif;
    }
    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    html, body { width:100%; height:100%; background:var(--bg); font-family:var(--font); color:var(--text); overflow:hidden; }
    input, textarea, select, button { font-family:var(--font); outline:none; }

    #app { width:100%; height:100%; background:var(--bg); display:flex; flex-direction:column; position:relative; overflow:hidden; }

    /* ===== 锁屏 ===== */
    #lockscreen {
      position:absolute; inset:0; z-index:1000;
      background:linear-gradient(150deg,#1a1a1a 0%,#2a2826 100%);
      background-image:url('https://zora404.dpdns.org/file/1786970531449_IMG_5753.jpeg');
      background-size:cover; background-position:center;
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      transition:transform 0.6s cubic-bezier(0.22,1,0.36,1), opacity 0.6s ease;
      color:#fff; cursor:pointer;
    }
    #lockscreen.unlock { transform:translateY(-100%); opacity:0; pointer-events:none; }
    #lockscreen .time { font-size:72px; font-weight:200; letter-spacing:2px; text-shadow:0 2px 20px rgba(0,0,0,0.3); }
    #lockscreen .date { font-size:16px; font-weight:300; color:rgba(255,255,255,0.5); letter-spacing:4px; margin-top:4px; text-shadow:0 2px 20px rgba(0,0,0,0.3); }
    #lockscreen .hint { position:absolute; bottom:56px; font-size:12px; font-weight:300; color:rgba(255,255,255,0.15); letter-spacing:6px; animation:pulseLock 2.8s ease-in-out infinite; }
    @keyframes pulseLock { 0%,100%{opacity:0.12;} 50%{opacity:0.5;} }
    .lock-swipe { position:absolute; bottom:80px; left:20%; right:20%; height:2px; background:rgba(255,255,255,0.06); border-radius:2px; overflow:hidden; }
    .lock-swipe .bar { width:25%; height:100%; background:rgba(255,255,255,0.12); border-radius:2px; animation:swipeBar 2.8s ease-in-out infinite; }
    @keyframes swipeBar { 0%{transform:translateX(-100%);} 100%{transform:translateX(500%);} }

    /* ===== 状态栏 ===== */
    #statusbar {
      padding:10px 20px 6px; display:flex; justify-content:space-between; font-size:12px; font-weight:400; color:var(--text-sec); flex-shrink:0; background:rgba(245,243,240,0.6); backdrop-filter:blur(20px); position:relative; z-index:50;
    }

    /* ===== 桌面 ===== */
    #desktop {
      flex:1; padding:8px 18px 12px; display:flex; flex-direction:column; background:var(--bg); overflow:hidden; position:relative;
    }
    /* 桌面壁纸 - 透明度从0.08提到0.35，让图片可见 */
    #desktop::before {
      content:''; position:absolute; inset:0;
      background-image:url('https://zora404.dpdns.org/file/1786970535430_IMG_5751.jpeg');
      background-size:cover; background-position:center;
      opacity:0.35; pointer-events:none; z-index:0;
    }
    .page-dots { text-align:center; font-size:10px; color:var(--text-ter); padding:4px 0 12px; flex-shrink:0; letter-spacing:8px; opacity:0.4; position:relative; z-index:1; }
    .app-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:18px 6px; padding:8px 0; flex:1; align-content:flex-start; position:relative; z-index:1; }
    .app-item { display:flex; flex-direction:column; align-items:center; gap:6px; cursor:pointer; padding:4px 0; transition:transform 0.1s; }
    .app-item:active { transform:scale(0.88); }
    .app-item .icon { width:58px; height:58px; border-radius:var(--radius); display:flex; align-items:center; justify-content:center; font-size:14px; font-weight:400; color:#fff; background:var(--bg-dark); box-shadow:var(--shadow); overflow:hidden; }
    .app-item .icon img { width:100%; height:100%; object-fit:cover; }
    .app-item .icon.gold { background:var(--gold); }
    .app-item .name { font-size:10px; font-weight:400; color:var(--text-sec); text-align:center; }
    #dock { display:flex; justify-content:center; gap:28px; padding:10px 0 4px; border-top:var(--border); background:rgba(255,255,255,0.15); backdrop-filter:blur(20px); border-radius:var(--radius); margin:0 4px 4px; flex-shrink:0; position:relative; z-index:1; }
    #dock .app-item .icon { width:48px; height:48px; font-size:12px; }

    /* ===== 应用窗口 ===== */
    .app-win {
      position:absolute; inset:0; z-index:100; background:var(--bg); display:none; flex-direction:column; animation:winOpen 0.3s cubic-bezier(0.22,1,0.36,1);
    }
    .app-win.open { display:flex; }
    @keyframes winOpen { from { opacity:0; transform:scale(0.96) translateY(8px); } to { opacity:1; transform:scale(1) translateY(0); } }
    .app-win .header { padding:14px 16px 10px; background:rgba(255,255,255,0.5); backdrop-filter:blur(20px); border-bottom:var(--border); display:flex; align-items:center; gap:10px; flex-shrink:0; }
    .app-win .header .back { font-size:20px; font-weight:300; cursor:pointer; color:var(--text-sec); line-height:1; padding:0 4px; border:none; background:none; }
    .app-win .header .back:active { color:var(--text); }
    .app-win .header .title { font-size:15px; font-weight:500; color:var(--text); flex:1; }
    .app-win .header .action { padding:6px 16px; border:none; border-radius:var(--radius-full); background:var(--bg-dark); color:#fff; font-size:12px; font-weight:400; cursor:pointer; transition:background 0.15s; }
    .app-win .header .action:active { background:var(--text-sec); }
    .app-win .body { flex:1; padding:14px 16px 20px; overflow-y:auto; display:flex; flex-direction:column; gap:12px; }

    /* ===== 消息列表 ===== */
    .chat-list-item { display:flex; align-items:center; gap:12px; padding:12px 0; border-bottom:var(--border); cursor:pointer; transition:background 0.1s; }
    .chat-list-item:active { background:rgba(0,0,0,0.02); }
    .chat-list-item .avatar { width:44px; height:44px; border-radius:var(--radius); background:var(--gold-light); display:flex; align-items:center; justify-content:center; font-size:14px; font-weight:500; color:var(--text); flex-shrink:0; overflow:hidden; }
    .chat-list-item .avatar img { width:100%; height:100%; object-fit:cover; }
    .chat-list-item .info { flex:1; min-width:0; }
    .chat-list-item .info .name { font-weight:500; font-size:14px; }
    .chat-list-item .info .msg { font-size:13px; color:var(--text-sec); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .chat-list-item .time { font-size:11px; color:var(--text-ter); flex-shrink:0; }

    /* ===== 聊天窗口 ===== */
    .chat-msgs { flex:1; display:flex; flex-direction:column; gap:6px; padding:8px 4px; overflow-y:auto; }
    .chat-msgs .empty { text-align:center; color:var(--text-ter); padding:40px 0; font-size:14px; font-weight:300; }
    .chat-msgs .empty .big { font-size:32px; display:block; margin-bottom:8px; font-weight:200; color:#ddd; }
    .chat-msg { max-width:78%; padding:10px 16px; border-radius:var(--radius); font-size:14px; font-weight:400; line-height:1.6; word-break:break-word; animation:fadeUp 0.2s ease; }
    .chat-msg.user { align-self:flex-end; background:var(--bg-dark); color:#fff; }
    .chat-msg.ai { align-self:flex-start; background:var(--bg-card); color:var(--text); border:var(--border); box-shadow:var(--shadow); }
    .chat-msg .t { font-size:9px; font-weight:300; opacity:0.3; display:block; text-align:right; margin-top:4px; }
    .chat-msg.user .t { color:rgba(255,255,255,0.4); }
    .chat-msg.ai .t { color:var(--text-ter); }
    @keyframes fadeUp { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
    .chat-msg.ai + .chat-msg.ai, .chat-msg.user + .chat-msg.user { margin-top:4px; }
    .chat-msg.user + .chat-msg.ai, .chat-msg.ai + .chat-msg.user { margin-top:16px; }
    .typing-dots { align-self:flex-start; background:var(--bg-card); padding:10px 18px; border-radius:var(--radius); display:none; gap:6px; border:var(--border); box-shadow:var(--shadow); }
    .typing-dots.show { display:flex; }
    .typing-dots span { width:6px; height:6px; border-radius:50%; background:var(--text-ter); animation:dotB 1.4s infinite both; }
    .typing-dots span:nth-child(1){animation-delay:-0.32s}
    .typing-dots span:nth-child(2){animation-delay:-0.16s}
    .typing-dots span:nth-child(3){animation-delay:0s}
    @keyframes dotB { 0%,60%,100%{transform:translateY(0);opacity:0.15;} 30%{transform:translateY(-6px);opacity:0.6;} }

    /* ===== 输入栏 ===== */
    .chat-input { display:flex; gap:8px; padding:8px 0 4px; border-top:var(--border); flex-shrink:0; background:rgba(255,255,255,0.3); backdrop-filter:blur(10px); align-items:center; }
    .chat-input input { flex:1; padding:10px 14px; border:var(--border); background:var(--bg-input); font-size:14px; font-weight:400; color:var(--text); border-radius:var(--radius-full); transition:border-color 0.2s; }
    .chat-input input:focus { border-color:var(--gold); background:#fff; }
    .chat-input input::placeholder { color:var(--text-ter); font-weight:300; }
    .chat-input .btn-send { padding:10px 20px; border:none; border-radius:var(--radius-full); background:var(--bg-dark); color:#fff; font-size:14px; font-weight:400; cursor:pointer; }
    .chat-input .btn-send:active { transform:scale(0.94); }

    /* ===== 个人资料（放在消息里） ===== */
    .profile-header { display:flex; flex-direction:column; align-items:center; padding:20px 0; border-bottom:var(--border); }
    .profile-header .avatar { width:72px; height:72px; border-radius:50%; background:var(--gold-light); display:flex; align-items:center; justify-content:center; font-size:14px; font-weight:500; margin-bottom:8px; overflow:hidden; }
    .profile-header .avatar img { width:100%; height:100%; object-fit:cover; }
    .profile-header .name { font-size:18px; font-weight:600; }
    .profile-header .id { font-size:13px; color:var(--text-sec); font-weight:300; }
    .profile-header .sig { font-size:13px; color:var(--text-sec); font-weight:300; margin-top:4px; font-style:italic; }
    .profile-stats { display:flex; gap:24px; padding:12px 0; border-bottom:var(--border); justify-content:center; }
    .profile-stats .stat { text-align:center; }
    .profile-stats .stat .num { font-size:16px; font-weight:600; }
    .profile-stats .stat .label { font-size:11px; color:var(--text-sec); font-weight:300; }
    .profile-menu { display:flex; flex-direction:column; gap:4px; }
    .profile-menu .item { padding:12px 0; border-bottom:var(--border); display:flex; justify-content:space-between; align-items:center; cursor:pointer; }
    .profile-menu .item:active { background:rgba(0,0,0,0.02); }
    .profile-menu .item .label { font-size:14px; font-weight:400; }
    .profile-menu .item .arrow { color:var(--text-ter); }

    /* ===== 角色 ===== */
    .role-form label { font-size:13px; font-weight:400; color:var(--text); display:flex; flex-direction:column; gap:4px; }
    .role-form label small { font-weight:300; color:var(--text-ter); font-size:11px; }
    .role-form input, .role-form select, .role-form textarea { padding:8px 12px; border:var(--border); background:var(--bg-input); font-size:13px; border-radius:var(--radius-sm); transition:border-color 0.2s; width:100%; }
    .role-form input:focus, .role-form select:focus, .role-form textarea:focus { border-color:var(--gold); background:#fff; }
    .role-form textarea { min-height:80px; resize:vertical; }
    .role-form .row { display:flex; gap:12px; }
    .role-form .row > * { flex:1; }
    .role-tabs { display:flex; gap:8px; border-bottom:var(--border); padding-bottom:8px; }
    .role-tabs .tab { padding:6px 16px; border-radius:var(--radius-full); font-size:13px; font-weight:400; cursor:pointer; transition:all 0.15s; }
    .role-tabs .tab.active { background:var(--bg-dark); color:#fff; }
    .role-tabs .tab:not(.active) { color:var(--text-sec); }
    .role-tabs .tab:not(.active):active { background:var(--gold-light); }

    /* ===== 世界书 ===== */
    .world-item { background:var(--bg-card); padding:12px 16px; border-radius:var(--radius-sm); border-left:3px solid var(--gold); border:var(--border); }
    .world-item .head { display:flex; justify-content:space-between; align-items:center; }
    .world-item .name { font-weight:500; font-size:14px; }
    .world-item .scope { font-size:10px; font-weight:300; color:var(--text-ter); background:var(--bg-input); padding:2px 10px; border-radius:var(--radius-full); }
    .world-item .content { font-size:13px; font-weight:300; color:var(--text-sec); margin-top:6px; line-height:1.5; }
    .world-item .acts { display:flex; gap:10px; margin-top:8px; }
    .world-item .acts button { background:transparent; border:none; color:var(--text-ter); font-size:12px; font-weight:400; cursor:pointer; padding:0; }
    .world-item .acts button:active { color:var(--text); }
    .world-item .acts .del { color:#d64545; }

    /* ===== 设置 ===== */
    .setting-item { display:flex; justify-content:space-between; align-items:center; padding:12px 0; border-bottom:var(--border); flex-wrap:wrap; gap:8px; }
    .setting-item .label { font-size:14px; font-weight:400; }
    .setting-item .toggle { width:44px; height:26px; border-radius:var(--radius-full); background:var(--text-ter); cursor:pointer; transition:background 0.2s; position:relative; flex-shrink:0; }
    .setting-item .toggle.on { background:var(--gold); }
    .setting-item .toggle .knob { width:20px; height:20px; border-radius:50%; background:#fff; position:absolute; top:3px; left:3px; transition:transform 0.2s; box-shadow:0 1px 4px rgba(0,0,0,0.1); }
    .setting-item .toggle.on .knob { transform:translateX(18px); }
    .setting-item input[type="text"], .setting-item input[type="password"] { padding:6px 10px; border:var(--border); background:var(--bg-input); border-radius:var(--radius-sm); font-size:13px; width:180px; max-width:100%; }
    .setting-item select { padding:6px 10px; border:var(--border); background:var(--bg-input); border-radius:var(--radius-sm); font-size:13px; }
    .setting-item .range-wrap { display:flex; align-items:center; gap:10px; }
    .setting-item .range-wrap input[type="range"] { width:120px; }

    /* ===== Drawer ===== */
    .drawer-mask {
      position:fixed; inset:0; z-index:200; opacity:0; pointer-events:none; transition:opacity 0.35s ease; background:rgba(0,0,0,0.15); backdrop-filter:blur(4px);
    }
    .drawer-mask.open { opacity:1; pointer-events:auto; }
    .drawer-panel {
      position:fixed; top:0; right:0; bottom:0; width:80%; max-width:340px;
      background:var(--bg-card); box-shadow:-8px 0 40px rgba(0,0,0,0.04);
      transform:translateX(100%); transition:transform 0.4s cubic-bezier(0.22,1,0.36,1);
      padding:20px 18px; overflow-y:auto; display:flex; flex-direction:column; gap:12px;
    }
    .drawer-mask.open .drawer-panel { transform:translateX(0); }
    .drawer-panel .close { align-self:flex-end; font-size:20px; font-weight:300; cursor:pointer; color:var(--text-ter); background:none; border:none; padding:0 4px; }
    .drawer-panel .title { font-size:17px; font-weight:500; color:var(--text); }

    /* ===== Snackbar ===== */
    #snackbar {
      position:fixed; left:50%; bottom:32px; z-index:9999;
      transform:translate(-50%, 20px);
      background:var(--bg-dark); color:#fff;
      padding:10px 20px; border-radius:var(--radius);
      box-shadow:0 8px 40px rgba(26,26,26,0.08);
      opacity:0; transition:all 0.4s cubic-bezier(0.22,1,0.36,1);
      pointer-events:none; font-size:14px; font-weight:300; max-width:90%;
    }
    #snackbar.show { opacity:1; transform:translate(-50%,0); pointer-events:auto; }

    /* ===== 通用 ===== */
    .empty-state { text-align:center; color:var(--text-ter); padding:30px 0; font-size:13px; font-weight:300; }
    .empty-state .big { font-size:32px; font-weight:200; display:block; margin-bottom:8px; color:#ddd; }
    .btn { padding:6px 16px; border:none; border-radius:var(--radius-full); font-size:12px; font-weight:400; cursor:pointer; transition:background 0.15s, transform 0.1s; }
    .btn:active { transform:scale(0.94); }
    .btn-dark { background:var(--bg-dark); color:#fff; }
    .btn-dark:active { background:var(--text-sec); }
    .btn-ghost { background:transparent; color:var(--text-sec); border:var(--border); }

    ::-webkit-scrollbar { width:0; background:transparent; }
  </style>
</head>
<body>
<div id="app">

  <!-- ===== 锁屏 ===== -->
  <div id="lockscreen" onclick="unlock()">
    <div class="time" id="lockTime">12:00</div>
    <div class="date" id="lockDate">2026年8月17日</div>
    <div class="hint">上滑解锁</div>
    <div class="lock-swipe"><div class="bar"></div></div>
  </div>

  <!-- ===== 状态栏 ===== -->
  <div id="statusbar">
    <span id="statusTime">12:00</span>
    <span></span>
  </div>

  <!-- ===== 桌面 ===== -->
  <div id="desktop">
    <div class="page-dots">● ● ○</div>
    <div class="app-grid" id="appGrid">
      <div class="app-item" data-app="chat"><div class="icon gold"><img src="https://zora404.dpdns.org/file/1786970318053_IMG_5742.jpeg" alt="消息"></div><span class="name">消息</span></div>
      <div class="app-item" data-app="roles"><div class="icon"><img src="https://zora404.dpdns.org/file/1786970321106_IMG_5748.jpeg" alt="角色"></div><span class="name">角色</span></div>
      <div class="app-item" data-app="world"><div class="icon"><img src="https://zora404.dpdns.org/file/1786970319904_IMG_5747.jpeg" alt="世界书"></div><span class="name">世界书</span></div>
      <div class="app-item" data-app="settings"><div class="icon"><img src="https://zora404.dpdns.org/file/1786970320660_IMG_5746.jpeg" alt="设置"></div><span class="name">设置</span></div>
    </div>
    <div id="dock">
      <div class="app-item" style="opacity:0.15;pointer-events:none;"><div class="icon" style="background:var(--bg-input);color:var(--text-ter);font-size:10px;">电话</div><span class="name">电话</span></div>
      <div class="app-item" style="opacity:0.15;pointer-events:none;"><div class="icon" style="background:var(--bg-input);color:var(--text-ter);font-size:10px;">浏览</div><span class="name">浏览器</span></div>
    </div>
  </div>

  <!-- ============================================================
     消息 (包含对话列表 + 个人资料)
     ============================================================ -->
  <div class="app-win" id="chatWin">
    <div class="header">
      <span class="back" data-close="chatWin">←</span>
      <span class="title" id="chatTitle">消息</span>
      <button class="action" id="chatToggleProfile">我</button>
    </div>
    <div class="body" id="chatBody">
      <!-- 对话列表 (默认显示) -->
      <div id="chatListBody"><div class="empty-state"><span class="big">✉</span>暂无对话</div></div>
      <!-- 个人资料 (隐藏) -->
      <div id="profileBody" style="display:none;">
        <div class="profile-header">
          <div class="avatar"><img src="https://zora404.dpdns.org/file/1786970323496_IMG_5217.jpeg" alt="avatar"></div>
          <div class="name">phage</div>
          <div class="id">@phage8026</div>
          <div class="sig">"别以为我是 我就不能弄你"</div>
        </div>
        <div class="profile-stats">
          <div class="stat"><div class="num">0</div><div class="label">Pests</div></div>
          <div class="stat"><div class="num">520</div><div class="label">Followers</div></div>
          <div class="stat"><div class="num">162</div><div class="label">Following</div></div>
        </div>
        <div class="profile-menu">
          <div class="item"><span class="label">微信支付</span><span class="arrow">›</span></div>
          <div class="item"><span class="label">我的收藏</span><span class="arrow">›</span></div>
          <div class="item"><span class="label">表情</span><span class="arrow">›</span></div>
          <div class="item"><span class="label">插件</span><span class="arrow">›</span></div>
          <div class="item"><span class="label">美化</span><span class="arrow">›</span></div>
          <div class="item" style="border-bottom:none;"><span class="label" style="color:#d64545;">切换账号</span><span class="arrow">›</span></div>
        </div>
      </div>
    </div>
  </div>

  <!-- ===== 聊天窗口 (点击对话后打开) ===== -->
  <div class="app-win" id="convWin">
    <div class="header"><button class="back" data-close="convWin">←</button><span class="title" id="convTitle">对话</span></div>
    <div class="body" style="padding:8px 14px 12px;">
      <div class="chat-msgs" id="convMsgs"><div class="empty"><span class="big">✧</span>开始对话</div><div class="typing-dots" id="convTyping"><span></span><span></span><span></span></div></div>
      <div class="chat-input">
        <input type="text" id="convInput" placeholder="输入消息…" autocomplete="off">
        <button class="btn-send" id="convSend">发送</button>
      </div>
    </div>
  </div>

  <!-- ============================================================
     角色
     ============================================================ -->
  <div class="app-win" id="rolesWin">
    <div class="header"><button class="back" data-close="rolesWin">←</button><span class="title">角色</span><button class="action" id="addRoleBtn">+ 新建</button></div>
    <div class="body" id="rolesBody">
      <div class="role-tabs" id="roleTabs">
        <span class="tab active" data-filter="all">全部</span>
        <span class="tab" data-filter="CHAR">CHAR</span>
        <span class="tab" data-filter="NPC">NPC</span>
        <span class="tab" data-filter="USER">USER</span>
      </div>
      <div id="roleList"></div>
    </div>
  </div>

  <!-- ===== 编辑角色弹窗 ===== -->
  <div class="drawer-mask" id="roleDrawer">
    <div class="drawer-panel">
      <button class="close" id="roleDrawerClose">✕</button>
      <div class="title">编辑角色</div>
      <div class="role-form" id="roleForm">
        <div class="row">
          <label>类型 <select id="roleType"><option value="CHAR">CHAR</option><option value="NPC">NPC</option><option value="USER">USER</option></select></label>
          <label>性别 <select id="roleGender"><option value="未知">未知</option><option value="男">男</option><option value="女">女</option><option value="其他">其他</option></select></label>
        </div>
        <label>昵称 <input type="text" id="roleName" placeholder="输入昵称"></label>
        <label>分组 <input type="text" id="roleGroup" placeholder="如：家人、同学、职场"></label>
        <label>人物设定 <textarea id="roleDesc" placeholder="角色背景、性格、经历…"></textarea></label>
        <label><small>导入 .txt</small> <input type="file" id="roleImport" accept=".txt"></label>
        <div style="display:flex;gap:8px;margin-top:4px;"><button class="btn btn-dark" id="roleSaveBtn">保存</button><button class="btn btn-ghost" id="roleDeleteBtn" style="color:#d64545;">删除</button></div>
      </div>
    </div>
  </div>

  <!-- ============================================================
     世界书
     ============================================================ -->
  <div class="app-win" id="worldWin">
    <div class="header"><button class="back" data-close="worldWin">←</button><span class="title">世界书</span><button class="action" id="addWorldBtn">+ 新建</button></div>
    <div class="body" id="worldBody">
      <div style="font-size:12px;font-weight:300;color:var(--text-ter);margin-bottom:4px;">全局自动生效 · 局部需绑定</div>
      <div id="worldList"></div>
    </div>
  </div>

  <!-- ===== 编辑世界书弹窗 ===== -->
  <div class="drawer-mask" id="worldDrawer">
    <div class="drawer-panel">
      <button class="close" id="worldDrawerClose">✕</button>
      <div class="title">编辑世界书</div>
      <div class="role-form">
        <label>名称 <input type="text" id="worldName" placeholder="世界书名称"></label>
        <label>内容 <textarea id="worldContent" placeholder="世界书内容…" style="min-height:80px;"></textarea></label>
        <label>范围 <select id="worldScope"><option value="global">全局</option><option value="local">局部</option></select></label>
        <div style="display:flex;gap:8px;margin-top:4px;"><button class="btn btn-dark" id="worldSaveBtn">保存</button><button class="btn btn-ghost" id="worldDeleteBtn" style="color:#d64545;">删除</button></div>
      </div>
    </div>
  </div>

  <!-- ============================================================
     设置
     ============================================================ -->
  <div class="app-win" id="settingsWin">
    <div class="header"><button class="back" data-close="settingsWin">←</button><span class="title">设置</span></div>
    <div class="body" id="settingsBody"></div>
  </div>

  <!-- ============================================================
     Snackbar
     ============================================================ -->
  <div id="snackbar"><span id="snackMsg"></span></div>

</div>

<script>
(function(){
  "use strict";

  // ===== 工具 =====
  const $ = (s,c=document) => c.querySelector(s);
  const $$ = (s,c=document) => [...c.querySelectorAll(s)];
  function timeStr(){ const d=new Date(); return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }
  function dateStr(){ const d=new Date(); return d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日'; }
  function genId(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,6); }

  // ===== 存储 =====
  const K = {
    chats:'sc_chats', roles:'sc_roles', world:'sc_world',
    settings:'sc_settings', messages:'sc_messages', currentChat:'sc_currentchat'
  };
  function load(k,d){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):d; }catch(e){return d;} }
  function save(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }

  // ===== 默认数据 =====
  let chats = load(K.chats, [
    { id:'c1', name:'luna.chen', avatar:'L', lastMsg:'起来吃饭 · 想吃什么', time:'17:50' }
  ]);
  let roles = load(K.roles, [
    { id:'r1', type:'CHAR', name:'luna.chen', gender:'男', group:'', desc:'Luna Chen - 完整人设' }
  ]);
  let worldBooks = load(K.world, [
    { id:'w1', name:'现代都市', content:'故事发生在2024年的上海…', scope:'global' }
  ]);
  let settings = load(K.settings, { notify:true, keepalive:true, dark:false, fontSize:16 });
  let messages = load(K.messages, {});
  let currentChatId = load(K.currentChat, null);

  // ===== 状态 =====
  let editingRoleId = null;
  let editingWorldId = null;
  let convMsgList = [];
  let showProfile = false;
  const DEFAULT_AVATAR = 'https://zora404.dpdns.org/file/1786970323932_IMG_5219.jpeg';

  // ===== Snackbar =====
  function snack(msg){
    const el=$('#snackbar'); const msgEl=$('#snackMsg');
    if(!el) return;
    msgEl.textContent=msg;
    el.classList.add('show');
    clearTimeout(el._timer);
    el._timer=setTimeout(()=>el.classList.remove('show'), 2500);
  }

  // ===== 解锁 =====
  window.unlock = function(){ $('#lockscreen').classList.add('unlock'); };

  // ===== 时钟 =====
  function updateClock(){
    const t=timeStr(); const d=dateStr();
    const el1=$('#statusTime'); if(el1) el1.textContent=t;
    const el2=$('#lockTime'); if(el2) el2.textContent=t;
    const el3=$('#lockDate'); if(el3) el3.textContent=d;
  }
  updateClock(); setInterval(updateClock,30000);

  // ===== 应用切换 =====
  function openApp(id){ $$('.app-win').forEach(w=>w.classList.remove('open')); const el=$('#'+id+'Win'); if(el) el.classList.add('open'); }
  function closeApp(id){ const el=$('#'+id+'Win'); if(el) el.classList.remove('open'); }

  // 返回按钮 - 修复: 用事件委托处理所有返回按钮
  document.addEventListener('click', function(e){
    const back = e.target.closest('[data-close]');
    if(back){
      const targetId = back.dataset.close;
      closeApp(targetId);
      e.preventDefault();
    }
  });

  // 桌面点击
  $('#appGrid').addEventListener('click', function(e){
    const item=e.target.closest('.app-item'); if(!item) return;
    const app=item.dataset.app;
    if(app==='chat'){ renderChatList(); showProfile=false; toggleProfileView(); openApp('chat'); }
    else if(app==='roles'){ renderRoles(); openApp('roles'); }
    else if(app==='world'){ renderWorldBooks(); openApp('world'); }
    else if(app==='settings'){ renderSettings(); openApp('settings'); }
  });

  // ============================================================
  // 消息 + 个人资料切换
  // ============================================================
  function toggleProfileView(){
    const list=$('#chatListBody');
    const profile=$('#profileBody');
    if(showProfile){
      list.style.display='none';
      profile.style.display='flex';
      profile.style.flexDirection='column';
      profile.style.gap='12px';
      $('#chatTitle').textContent='我';
    }else{
      list.style.display='block';
      profile.style.display='none';
      $('#chatTitle').textContent='消息';
    }
  }

  $('#chatToggleProfile').addEventListener('click', function(){
    showProfile = !showProfile;
    toggleProfileView();
  });

  // ============================================================
  // 消息列表
  // ============================================================
  function renderChatList(){
    const body=$('#chatListBody');
    if(!body) return;
    body.innerHTML='';
    if(chats.length===0){ body.innerHTML='<div class="empty-state"><span class="big">✉</span>暂无对话</div>'; return; }
    chats.forEach(c=>{
      const div=document.createElement('div');
      div.className='chat-list-item';
      div.innerHTML='<div class="avatar"><img src="'+DEFAULT_AVATAR+'" alt=""></div><div class="info"><div class="name">'+c.name+'</div><div class="msg">'+c.lastMsg+'</div></div><div class="time">'+c.time+'</div>';
      div.addEventListener('click',()=>openConversation(c.id));
      body.appendChild(div);
    });
  }

  // 添加对话
  document.addEventListener('click', function(e){
    const btn=e.target.closest('#addChatBtn');
    if(!btn) return;
    const name=prompt('输入联系人名称：');
    if(!name) return;
    const id='c'+Date.now();
    chats.push({ id, name, avatar:name[0].toUpperCase(), lastMsg:'开始对话', time:timeStr() });
    save(K.chats, chats);
    renderChatList();
    snack('已添加 '+name);
  });

  // ============================================================
  // 对话窗口
  // ============================================================
  function openConversation(chatId){
    currentChatId=chatId;
    save(K.currentChat, chatId);
    const chat=chats.find(c=>c.id===chatId);
    if(!chat) return;
    $('#convTitle').textContent=chat.name;
    convMsgList = messages[chatId] || [];
    renderConvMsgs();
    openApp('conv');
  }

  function renderConvMsgs(){
    const container=$('#convMsgs');
    if(!container) return;
    $$('.chat-msg', container).forEach(el=>el.remove());
    const empty=container.querySelector('.empty');
    const typing=container.querySelector('#convTyping');
    if(convMsgList.length===0){ if(empty) empty.style.display='block'; if(typing) container.appendChild(typing); return; }
    if(empty) empty.style.display='none';
    const frag=document.createDocumentFragment();
    convMsgList.slice(-50).forEach(m=>{
      const div=document.createElement('div');
      div.className='chat-msg '+(m.role||'user');
      div.innerHTML=m.text+'<span class="t">'+m.time+'</span>';
      frag.appendChild(div);
    });
    if(typing) frag.appendChild(typing);
    container.appendChild(frag);
    container.scrollTop=container.scrollHeight;
  }

  function addConvMsg(role, text){
    if(!text.trim()) return;
    const entry={ role, text:text.trim(), time:timeStr() };
    convMsgList.push(entry);
    if(convMsgList.length>200) convMsgList.splice(0, convMsgList.length-200);
    if(currentChatId) messages[currentChatId]=convMsgList;
    save(K.messages, messages);
    const chat=chats.find(c=>c.id===currentChatId);
    if(chat){ chat.lastMsg=text.slice(0,30)+(text.length>30?'…':''); chat.time=timeStr(); save(K.chats, chats); renderChatList(); }
    renderConvMsgs();
  }

  function showConvTyping(show){
    const el=$('#convTyping');
    if(!el) return;
    if(show){ el.classList.add('show'); const c=$('#convMsgs'); if(c) setTimeout(()=>c.scrollTop=c.scrollHeight, 50); }
    else el.classList.remove('show');
  }

  async function sendConvMsg(){
    const input=$('#convInput'); if(!input) return;
    const text=input.value.trim(); if(!text) return;
    addConvMsg('user', text);
    input.value='';
    showConvTyping(true);
    await new Promise(r=>setTimeout(r, 400+Math.random()*500));
    const replies=['嗯嗯，我在听','有意思，继续说','好呀，我记下了','这个想法真棒','哈哈，确实','原来如此','你今天的分享很温暖'];
    const reply=replies[Math.floor(Math.random()*replies.length)];
    showConvTyping(false);
    addConvMsg('ai', reply);
  }

  $('#convSend').addEventListener('click', sendConvMsg);
  $('#convInput').addEventListener('keydown', function(e){ if(e.key==='Enter'){ e.preventDefault(); sendConvMsg(); } });

  // ============================================================
  // 角色
  // ============================================================
  let roleFilter='all';

  function renderRoles(){
    const list=$('#roleList'); if(!list) return;
    const filtered = roleFilter==='all' ? roles : roles.filter(r=>r.type===roleFilter);
    list.innerHTML='';
    if(filtered.length===0){ list.innerHTML='<div class="empty-state"><span class="big">◇</span>暂无角色</div>'; return; }
    filtered.forEach(r=>{
      const div=document.createElement('div'); div.className='contact-item';
      div.innerHTML='<div class="avatar">'+r.name[0].toUpperCase()+'</div><div class="info"><div class="name">'+r.name+'</div><div class="sub">'+r.gender+' · '+r.type+' · '+(r.group||'未分组')+'</div><div style="font-size:12px;color:var(--text-ter);font-weight:300;">'+r.desc.slice(0,40)+(r.desc.length>40?'…':'')+'</div></div>';
      div.style.cursor='pointer';
      div.addEventListener('click',()=>openRoleEditor(r.id));
      list.appendChild(div);
    });
  }

  $('#roleTabs').addEventListener('click', function(e){
    const tab=e.target.closest('.tab');
    if(!tab) return;
    $$('#roleTabs .tab').forEach(t=>t.classList.remove('active'));
    tab.classList.add('active');
    roleFilter=tab.dataset.filter;
    renderRoles();
  });

  function openRoleEditor(id){
    const r=roles.find(x=>x.id===id);
    if(!r) return;
    editingRoleId=id;
    $('#roleType').value=r.type;
    $('#roleGender').value=r.gender;
    $('#roleName').value=r.name;
    $('#roleGroup').value=r.group||'';
    $('#roleDesc').value=r.desc;
    $('#roleDrawer').classList.add('open');
  }

  $('#addRoleBtn').addEventListener('click', function(){
    editingRoleId=null;
    $('#roleType').value='CHAR';
    $('#roleGender').value='未知';
    $('#roleName').value='';
    $('#roleGroup').value='';
    $('#roleDesc').value='';
    $('#roleDrawer').classList.add('open');
  });

  $('#roleDrawerClose').addEventListener('click', function(){ $('#roleDrawer').classList.remove('open'); });
  $('#roleDrawer').addEventListener('click', function(e){ if(e.target===this) this.classList.remove('open'); });

  $('#roleSaveBtn').addEventListener('click', function(){
    const type=$('#roleType').value;
    const gender=$('#roleGender').value;
    const name=$('#roleName').value.trim();
    const group=$('#roleGroup').value.trim();
    const desc=$('#roleDesc').value.trim();
    if(!name){ snack('请输入昵称'); return; }
    if(editingRoleId){
      const r=roles.find(x=>x.id===editingRoleId);
      if(r){ r.type=type; r.gender=gender; r.name=name; r.group=group; r.desc=desc; }
    }else{
      roles.push({ id:'r'+Date.now(), type, gender, name, group, desc });
    }
    save(K.roles, roles);
    $('#roleDrawer').classList.remove('open');
    renderRoles();
    snack('角色已保存');
  });

  $('#roleDeleteBtn').addEventListener('click', function(){
    if(!editingRoleId) return;
    if(!confirm('确定删除此角色？')) return;
    roles=roles.filter(r=>r.id!==editingRoleId);
    save(K.roles, roles);
    $('#roleDrawer').classList.remove('open');
    renderRoles();
    snack('已删除');
  });

  $('#roleImport').addEventListener('change', function(e){
    const file=e.target.files[0]; if(!file) return;
    const reader=new FileReader();
    reader.onload=function(ev){ $('#roleDesc').value=ev.target.result; snack('已导入 '+file.name); };
    reader.readAsText(file);
    this.value='';
  });

  // ============================================================
  // 世界书
  // ============================================================
  function renderWorldBooks(){
    const list=$('#worldList'); if(!list) return;
    list.innerHTML='';
    if(worldBooks.length===0){ list.innerHTML='<div class="empty-state"><span class="big">◈</span>暂无世界书</div>'; return; }
    worldBooks.forEach(w=>{
      const div=document.createElement('div'); div.className='world-item';
      div.innerHTML=`
        <div class="head"><span class="name">${w.name}</span><span class="scope">${w.scope==='global'?'全局':'局部'}</span></div>
        <div class="content">${w.content}</div>
        <div class="acts">
          <button data-wedit="${w.id}">编辑</button>
          <button class="del" data-wdel="${w.id}">删除</button>
        </div>
      `;
      list.appendChild(div);
    });
    list.querySelectorAll('[data-wedit]').forEach(b=>{
      b.addEventListener('click', function(){
        const id=this.dataset.wedit;
        const w=worldBooks.find(x=>x.id===id);
        if(w){ openWorldEditor(w.id); }
      });
    });
    list.querySelectorAll('[data-wdel]').forEach(b=>{
      b.addEventListener('click', function(){
        const id=this.dataset.wdel;
        const w=worldBooks.find(x=>x.id===id);
        if(!w) return;
        if(!confirm('删除 "'+w.name+'" ？')) return;
        worldBooks=worldBooks.filter(x=>x.id!==id);
        save(K.world, worldBooks);
        renderWorldBooks();
        snack('已删除');
      });
    });
  }

  function openWorldEditor(id){
    const w=worldBooks.find(x=>x.id===id);
    if(w){
      editingWorldId=id;
      $('#worldName').value=w.name;
      $('#worldContent').value=w.content;
      $('#worldScope').value=w.scope;
    }else{
      editingWorldId=null;
      $('#worldName').value='';
      $('#worldContent').value='';
      $('#worldScope').value='global';
    }
    $('#worldDrawer').classList.add('open');
  }

  $('#addWorldBtn').addEventListener('click', function(){ openWorldEditor(null); });
  $('#worldDrawerClose').addEventListener('click', function(){ $('#worldDrawer').classList.remove('open'); });
  $('#worldDrawer').addEventListener('click', function(e){ if(e.target===this) this.classList.remove('open'); });

  $('#worldSaveBtn').addEventListener('click', function(){
    const name=$('#worldName').value.trim();
    const content=$('#worldContent').value.trim();
    const scope=$('#worldScope').value;
    if(!name){ snack('请输入名称'); return; }
    if(!content){ snack('请输入内容'); return; }
    if(editingWorldId){
      const w=worldBooks.find(x=>x.id===editingWorldId);
      if(w){ w.name=name; w.content=content; w.scope=scope; }
    }else{
      worldBooks.push({ id:'w'+Date.now(), name, content, scope });
    }
    save(K.world, worldBooks);
    $('#worldDrawer').classList.remove('open');
    renderWorldBooks();
    snack('世界书已保存');
  });

  $('#worldDeleteBtn').addEventListener('click', function(){
    if(!editingWorldId) return;
    if(!confirm('确定删除？')) return;
    worldBooks=worldBooks.filter(x=>x.id!==editingWorldId);
    save(K.world, worldBooks);
    $('#worldDrawer').classList.remove('open');
    renderWorldBooks();
    snack('已删除');
  });

  // ============================================================
  // 设置
  // ============================================================
  function renderSettings(){
    const body=$('#settingsBody'); if(!body) return;
    const s=settings;
    body.innerHTML=`
      <div class="setting-item"><span class="label">通知</span><div class="toggle ${s.notify?'on':''}" id="setNotify"><div class="knob"></div></div></div>
      <div class="setting-item"><span class="label">强力保活</span><div class="toggle ${s.keepalive?'on':''}" id="setKeepalive"><div class="knob"></div></div></div>
      <div class="setting-item" style="flex-direction:column;align-items:stretch;gap:6px;"><span class="label">API 配置</span>
        <input type="text" id="setApiUrl" placeholder="API 地址" value="${load('sc_api_url','')}">
        <input type="password" id="setApiKey" placeholder="API 密钥" value="${load('sc_api_key','')}">
        <select id="setModel"><option value="">选择模型</option><option value="gpt-4o-mini">gpt-4o-mini</option><option value="gpt-4o">gpt-4o</option></select>
        <div class="range-wrap"><span style="font-size:12px;">温度</span><input type="range" id="setTemp" min="0" max="1" step="0.1" value="${load('sc_api_temp',0.8)}"><span id="setTempDisplay" style="font-size:12px;color:var(--text-ter);">${load('sc_api_temp',0.8)}</span></div>
        <button class="btn btn-dark" id="setApiSave">保存 API</button>
      </div>
      <div class="setting-item"><span class="label">暗夜模式</span><div class="toggle ${s.dark?'on':''}" id="setDark"><div class="knob"></div></div></div>
      <div class="setting-item" style="flex-direction:column;align-items:stretch;gap:6px;"><span class="label">数据管理</span>
        <div style="display:flex;gap:8px;"><button class="btn btn-dark" id="setExport">导出备份</button><button class="btn btn-ghost" id="setImport">导入备份</button><button class="btn" style="background:#d64545;color:#fff;" id="setReset">重置</button></div>
        <input type="file" id="setImportInput" accept=".json" style="display:none;">
      </div>
    `;
    body.querySelectorAll('.toggle').forEach(el=>{
      el.addEventListener('click', function(){
        this.classList.toggle('on');
        const id=this.id;
        if(id==='setNotify') settings.notify=this.classList.contains('on');
        else if(id==='setKeepalive') settings.keepalive=this.classList.contains('on');
        else if(id==='setDark') settings.dark=this.classList.contains('on');
        save(K.settings, settings);
        if(id==='setDark') applyDarkMode();
      });
    });
    const tempSlider=$('#setTemp');
    if(tempSlider){ tempSlider.addEventListener('input', function(){ $('#setTempDisplay').textContent=this.value; }); }

    $('#setApiSave').addEventListener('click', function(){
      const url=$('#setApiUrl').value.trim(); const key=$('#setApiKey').value.trim();
      const model=$('#setModel').value; const temp=$('#setTemp').value;
      save('sc_api_url', url); save('sc_api_key', key); save('sc_api_model', model); save('sc_api_temp', parseFloat(temp));
      snack('API 配置已保存');
    });

    $('#setExport').addEventListener('click', function(){
      const data={ chats, roles, worldBooks, settings, messages, api:{url:load('sc_api_url',''),key:load('sc_api_key',''),model:load('sc_api_model',''),temp:load('sc_api_temp',0.8)} };
      const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
      const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='backup_'+dateStr().replace(/\//g,'-')+'.json'; a.click();
      snack('导出成功');
    });
    $('#setImport').addEventListener('click', ()=>$('#setImportInput').click());
    $('#setImportInput').addEventListener('change', function(e){
      const file=e.target.files[0]; if(!file) return;
      const reader=new FileReader();
      reader.onload=function(ev){ try{ const data=JSON.parse(ev.target.result); if(data.chats) chats=data.chats; if(data.roles) roles=data.roles; if(data.worldBooks) worldBooks=data.worldBooks; if(data.settings) settings=data.settings; if(data.messages) messages=data.messages; save(K.chats,chats); save(K.roles,roles); save(K.world,worldBooks); save(K.settings,settings); save(K.messages,messages); snack('导入成功'); location.reload(); }catch(err){ snack('导入失败'); } };
      reader.readAsText(file);
      this.value='';
    });
    $('#setReset').addEventListener('click', function(){
      if(!confirm('确定重置所有数据？')) return;
      Object.values(K).forEach(k=>localStorage.removeItem(k));
      ['sc_api_url','sc_api_key','sc_api_model','sc_api_temp'].forEach(k=>localStorage.removeItem(k));
      location.reload();
    });
  }

  function applyDarkMode(){
    const dark=settings.dark;
    if(dark){
      document.documentElement.style.setProperty('--bg', '#1a1a1a');
      document.documentElement.style.setProperty('--bg-card', '#2a2a2a');
      document.documentElement.style.setProperty('--bg-input', '#333');
      document.documentElement.style.setProperty('--text', '#e8e4e0');
      document.documentElement.style.setProperty('--text-sec', '#aaa');
      document.documentElement.style.setProperty('--text-ter', '#666');
      document.documentElement.style.setProperty('--border', '1px solid rgba(255,255,255,0.06)');
      document.querySelector('#desktop').style.background='#1a1a1a';
      document.querySelector('#app').style.background='#1a1a1a';
    }else{
      document.documentElement.style.setProperty('--bg', '#f5f3f0');
      document.documentElement.style.setProperty('--bg-card', '#ffffff');
      document.documentElement.style.setProperty('--bg-input', '#f0ede8');
      document.documentElement.style.setProperty('--text', '#1a1a1a');
      document.documentElement.style.setProperty('--text-sec', '#6e6a66');
      document.documentElement.style.setProperty('--text-ter', '#b0aaa4');
      document.documentElement.style.setProperty('--border', '1px solid rgba(26,26,26,0.04)');
      document.querySelector('#desktop').style.background='var(--bg)';
      document.querySelector('#app').style.background='var(--bg)';
    }
  }

  // ============================================================
  // 启动
  // ============================================================
  function init(){
    if(window.__init) return; window.__init=true;
    applyDarkMode();
    renderChatList();
    // 消息默认显示列表，不显示profile
    showProfile=false;
    toggleProfileView();
    console.log('📱 精简版已启动 · 消息/角色/世界书/设置');
  }

  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', init);
  else init();

})();
</script>
</body>
</html>
